<section
  class="problem-detail"
  id="problem-detail"
  aria-labelledby="problem-detail-title"
  hidden
>
  <div class="ps-toolbar">
    <button
      class="ps-close"
      data-action="close-detail"
      aria-label="Close problem details and return to problem statements"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8 8 24 24M24 8 8 24" />
      </svg>
    </button>
  </div>
  <div class="problem-detail-body">
    <div class="problem-copy-column">
      <div class="problem-header-row">
        <h2 id="problem-detail-title">Problem Statement 1:</h2>
        <a
          id="problem-download-btn"
          class="ps-download-btn"
          href="#"
          download
          target="_blank"
          rel="noopener"
          aria-label="Download problem statement DOCX"
        >
          <span class="ps-download-crewmate-wrap" aria-hidden="true">
            <img
              class="ps-download-crewmate"
              src="assets/crew_mini_cyan.png"
              alt=""
              width="20"
              height="26"
            />
          </span>
          <span class="ps-download-text">DOWNLOAD PS</span>
          <span class="ps-download-badge">DOCX</span>
          <svg
            class="ps-download-arrow"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </a>
      </div>
      <div
        class="problem-description"
        tabindex="0"
        aria-label="Problem statement description"
      >
        <span class="problem-domain-label" id="problem-domain-label"></span>
        <h3 id="problem-name"></h3>
        <div id="problem-sections"></div>
      </div>
    </div>
    <aside class="problem-character" aria-label="Mission crewmate">
      <img id="problem-character-image" src="/src/sections/problem-statements/characters/fintech-escrow.svg" width="240" height="270" alt="Cyan payment crewmate with a microchip, rupee coin and secure payment terminal" /><span
        id="problem-character-label"
        >Escrow Pilot</span
      >
      <small id="problem-character-domain">Fintech / 01</small>
    </aside>
  </div>
</section>
